# Configuration d'Alembic. L'URL de la base n'est pas ici : migrations/env.py la lit
# dans les paramètres de l'application (variable CHANTIER_URL_BASE).

[alembic]
script_location = %(here)s/migrations
# Rend le paquet `app` importable quand on lance `alembic` depuis le dossier backend.
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
