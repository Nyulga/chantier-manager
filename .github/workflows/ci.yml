# Intégration continue : rejoue sur GitHub les vérifications du poste (`just verifier`).
# Squelette : lint, typage, architecture, tailles, duplication, client généré à jour, sécurité du code,
# tests et couverture, plus les tests de bout en bout, le job `hooks` (les hooks git, rejoués sur tout
# le dépôt) et le job `securite` (secrets, dépendances, Trivy). Les tests de mutation et CodeQL sont
# reportés à la phase 2.
#
# Toutes les actions sont épinglées par l'empreinte (SHA) d'un commit, la version restant en
# commentaire : un tag peut être déplacé, pas un SHA. Dependabot propose les mises à jour.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Une nouvelle exécution sur la même branche annule la précédente, encore en cours.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Droits minimaux : la CI lit le dépôt, elle n'écrit rien.
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Installer les dépendances (versions verrouillées)
        working-directory: backend
        run: uv sync --locked
      - name: Vérifier le backend
        run: just verifier-back

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      # La version de pnpm est lue dans le champ `packageManager` de frontend/package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Installer les dépendances (versions verrouillées)
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Vérifier le frontend
        run: just verifier-front
      # La duplication (jscpd) se mesure ici, parce que l'outil est une dépendance du frontend, mais
      # elle porte aussi sur le code Python du backend.
      - name: Mesurer la duplication de code (backend et frontend)
        run: just doublons
      # Les tests de bout en bout jouent le parcours contre l'API réelle : Playwright la lance
      # depuis ../backend avec uv, sur une base SQLite temporaire.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Installer les dépendances de l'API (versions verrouillées)
        working-directory: backend
        run: uv sync --locked --no-dev
      # Le client TypeScript généré est versionné (ADR 0013, issue #43) : on régénère le schéma
      # OpenAPI de l'API, puis le client, et on échoue s'ils diffèrent du fichier commité.
      # Les dépendances d'exécution de l'API suffisent pour exporter le schéma.
      - name: Vérifier que le client généré est à jour
        run: just verifier-client
      - name: Installer Chromium pour Playwright
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: just e2e
      - name: Conserver le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-playwright
          path: frontend/playwright-report
          retention-days: 7

  # Les hooks git (.pre-commit-config.yaml), rejoués sur tout le dépôt. Ils appellent les mêmes outils
  # que les jobs ci-dessus : le contrôle est donc en partie redondant. Il est gardé pour deux raisons :
  # - un hook cassé (mauvais chemin, outil renommé) bloquerait les commits locaux sans qu'aucun autre
  #   job ne le voie ;
  # - il ajoute des contrôles qu'aucun autre job ne fait : fins de ligne, espaces en fin de ligne,
  #   YAML et TOML valides, marqueurs de fusion oubliés, fichiers volumineux.
  # Les hooks de push (tests, duplication) ne sont pas rejoués : les autres jobs les couvrent.
  # gitleaks est ignoré ici, car le job `securite` l'exécute sur tout l'historique.
  hooks:
    name: Hooks git
    runs-on: ubuntu-latest
    env:
      SKIP: gitleaks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Installer les dépendances du backend (versions verrouillées)
        working-directory: backend
        run: uv sync --locked
      # La version de pnpm est lue dans le champ `packageManager` de frontend/package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Installer les dépendances du frontend (versions verrouillées)
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # pre-commit est lancé à sa version exacte, comme dans la recette `just hooks`.
      - name: Rejouer les hooks de commit sur tous les fichiers
        run: uvx --from pre-commit==4.7.0 pre-commit run --all-files --show-diff-on-failure

  # Analyses de sécurité : secrets dans l'historique, dépendances vulnérables, configuration.
  # Une vulnérabilité réelle fait échouer le job : on la corrige, on ne la masque pas.
  securite:
    name: Sécurité
    runs-on: ubuntu-latest
    steps:
      # Historique complet (`fetch-depth: 0`) : un secret supprimé par un commit ultérieur
      # reste lisible dans l'historique, et doit être détecté.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks est lancé par son image officielle, épinglée par empreinte, plutôt que par
      # gitleaks-action : l'action n'examine que les commits de l'événement, pas tout l'historique.
      # Image ghcr.io/gitleaks/gitleaks v8.30.1.
      # Deux garde-fous contre un contrôle qui réussirait sans rien analyser :
      # - `safe.directory` est passé à git par l'environnement : le dépôt monté appartient à un
      #   autre utilisateur que celui du conteneur, et git refuserait sinon de le lire ;
      # - le journal est relu, et le job échoue si aucun commit n'a été analysé.
      - name: Rechercher des secrets dans tout l'historique (gitleaks)
        run: |
          set -o pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/depot:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/depot \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /depot --redact --no-banner --no-color --verbose 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          analyses=$(sed -n 's/.*INF \([0-9][0-9]*\) commits scanned.*/\1/p' "$RUNNER_TEMP/gitleaks.log")
          if [ -z "$analyses" ] || [ "$analyses" -lt 1 ]; then
            echo "::error::gitleaks n'a analysé aucun commit : le contrôle ne prouve rien."
            exit 1
          fi
          echo "gitleaks : $analyses commits analysés."
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # Les dépendances d'exécution exactes du verrou (uv.lock), avec leurs empreintes.
      - name: Auditer les dépendances Python (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --no-header --no-annotate -o "$RUNNER_TEMP/exigences.txt"
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/exigences.txt" --disable-pip
      # La version de pnpm est lue dans le champ `packageManager` de frontend/package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Auditer les dépendances JavaScript (pnpm audit)
        working-directory: frontend
        run: pnpm audit --prod
      # Trivy : vulnérabilités des fichiers de verrouillage et secrets, puis configuration
      # (Dockerfiles). Seules les sévérités HIGH et CRITICAL font échouer le job.
      - name: Analyser le dépôt (Trivy fs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Version de Trivy fixée ici : sans cela, l'action en choisit une à chaque mise à jour.
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: .cache
      - name: Analyser la configuration (Trivy config)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: config
          scan-ref: .
          skip-dirs: .cache
          severity: HIGH,CRITICAL
          exit-code: "1"
